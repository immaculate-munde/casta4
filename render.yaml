# Casta4 on Render — two Web Services from one repo.
# Dashboard: New → Blueprint → connect repo → apply this file.
# Set GROQ_API_KEY on casta4-api when prompted (secret).

services:
  - type: web
    name: casta4-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: npm ci
    startCommand: node rag-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_MAX_TOKENS
        value: "500"

  - type: web
    name: casta4-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAG_SERVER_URL
        fromService:
          type: web
          name: casta4-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_RAG_API_URL
        fromService:
          type: web
          name: casta4-api
          envVarKey: RENDER_EXTERNAL_URL
